name: Auto Sync Events

on:
  repository_dispatch:
    types: [sync_event]      # Cloudflare Worker এই ইভেন্টটি কল করবে
  workflow_dispatch:          # আপনি চাইলে ম্যানুয়ালি রান করতে পারবেন

permissions:
  contents: write            # ফাইল পরিবর্তন পুশ করার অনুমতি

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Scraper Script
        run: python scraper.py

      - name: Commit and Push Updated Data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add api/events.json
          git diff --staged --quiet || (git commit -m "Auto-update events.json [skip ci]" && git push)
