name: Auto Sync Sports Events

on:
  repository_dispatch:
    types: [source_data_changed]
  workflow_dispatch: # চাইলে আপনি নিজে ম্যানুয়ালিও রান করতে পারবেন

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Sync Script
        run: python main.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add api/events.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update sports schedule & channels [skip ci]" && git push)
